spring.application.name=ProjectF
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/projectf}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:projectf_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:projectf_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway is opt-in until an existing database has been assessed.
# The postgres profile enables migrations and Hibernate schema validation.
spring.flyway.enabled=false
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=31MB
app.office.soffice-path=${SOFFICE_PATH:}
app.office.word-path=${WORD_PATH:}
