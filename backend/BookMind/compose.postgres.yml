name: diplom-platform
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: diplom_platform
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in your shell}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - platform_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d diplom_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  platform_postgres_data:
